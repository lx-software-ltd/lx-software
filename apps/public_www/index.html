<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- {{token}} values are filled from public/content.json by the site-seo Vite plugin. -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="keywords" content="{{keywords}}" />
    <meta name="author" content="{{author}}" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="{{url}}" />
    <meta name="theme-color" content="#050505" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link
      rel="preload"
      as="image"
      href="/media/hk-harbour-v1-poster.webp"
      type="image/webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <img
        src="/media/hk-harbour-v1-poster.webp"
        alt=""
        style="position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000"
      />
      <p style="position:relative;z-index:2;color:#fff;font-family:monospace;padding:6rem 1rem">
        {{noscript}}
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
