<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- {{token}} values are filled from src/content/site.json by the site-seo Vite plugin. -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="keywords" content="{{keywords}}" />
    <meta name="author" content="{{author}}" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="{{url}}" />
    <meta name="theme-color" content="#050505" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link
      rel="preload"
      as="image"
      href="/media/hk-harbour-v1-poster.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- First paint for the harbour poster. Lengths match tokens.css (--nav-h, --site-max-width). -->
    <style>
      html { background: #050505; }
      body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      }
      #bg-video {
        position: fixed;
        top: 48px;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 0;
        max-width: 1280px;
        margin: 0 auto;
        background: #000;
        pointer-events: none;
        container-type: size;
      }
      #bg-video-frame {
        position: absolute;
        top: 0;
        left: 50%;
        translate: -50% 0;
        width: min(100cqw, calc(100cqh * var(--video-aspect, 1.7777778)));
        height: min(100cqh, calc(100cqw / var(--video-aspect, 1.7777778)));
        overflow: hidden;
        background: #000;
      }
      #bg-video-el {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="bg-video" class="bg-video" aria-hidden="true">
      <div id="bg-video-frame" class="bg-video-frame">
        <video
          id="bg-video-el"
          muted
          loop
          playsinline
          poster="/media/hk-harbour-v1-poster.webp"
          preload="none"
          disablepictureinpicture
          disableremoteplayback
          width="1280"
          height="720"
        ></video>
        <div id="boat-flag" class="boat-flag" hidden></div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="position:relative;z-index:2;color:#fff;font-family:monospace;padding:6rem 1rem">
        {{noscript}}
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
