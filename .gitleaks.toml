# Gitleaks overrides for this repository.
#
# The default ``generic-api-key`` rule matches unittest keyword arguments like
# ``object_key="..."`` in ``backend/lambda/admin/test_inbound_email_handler.py``
# (S3 path fixtures). That is a false positive; do not put real secrets in this
# file—the allowlist exists only to silence that pattern in history/PR scans.
title = "lx-software"

[extend]
useDefault = true

[allowlist]
description = "False positives: unittest kwargs and a deleted board-secret fixture that used dummy PEM / sk-or-v1 strings"
paths = [
  '''backend/lambda/admin/test_inbound_email_handler\.py''',
  # Removed in the CDK-owned-secrets change; gitleaks still scans the old commit.
  '''scripts/test_verify_board_secrets\.py''',
]

# Public read-only API keys minted by scripts/manage-public-api-keys.py use
# the ``lxpk_`` prefix precisely so any accidental commit is caught here.
[[rules]]
id = "lxsoftware-public-api-key"
description = "LX Software public read-only API key"
regex = '''lxpk_[A-Za-z0-9_\-]{30,}'''
