name: Lint

permissions:
  contents: read

on:
  workflow_dispatch:
  # No path filter. The `lint` job is a required check, and a skipped
  # required check leaves the pull request blocked.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  lint-web:
    name: Lint Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          node-version: "26"
          cache: npm
          working-directory: apps/public_www

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/public_www

  lint-admin-web:
    name: Lint Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          node-version: "26"
          cache: npm
          working-directory: apps/admin_web

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/admin_web

  build-cdk:
    name: Build CDK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          node-version: "26"
          cache: npm
          working-directory: backend/infrastructure

      - name: Build CDK
        working-directory: backend/infrastructure
        run: npm run build

  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install ruff

      - name: Ruff
        run: python3 -m ruff check backend/lambda scripts .cursor/hooks

  validate-agent-harness:
    name: Validate agent harness
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Run harness checks
        uses: lx-software-ltd/actions/agent-harness@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22

      - name: Test harness ratchets
        run: python3 -m unittest scripts/test_agent_hooks.py -v

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflows
        uses: lx-software-ltd/actions/workflow-conformance@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          mode: enforce
          profile: product

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-web
      - lint-admin-web
      - build-cdk
      - lint-python
      - validate-agent-harness
      - workflow-conformance
    if: always()
    steps:
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          needs-json: ${{ toJson(needs) }}
