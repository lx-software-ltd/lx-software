name: Lint

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-agent-harness:
    name: Validate agent harness
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24

      - name: Run harness checks
        uses: lx-software-ltd/actions/agent-harness@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          install: "false"

      - name: Run repository checks
        run: bash scripts/ci/repo-checks.sh

  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          # template:set
          # template:end

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          install: "false"

      - name: Install hook dependencies
        run: bash scripts/ci/hook-deps.sh


      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run mypy
        run: bash scripts/ci/mypy.sh

  lint-admin-web:
    name: Lint Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/admin_web

  lint-public-www:
    name: Lint Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/public_www

  lint-cdk:
    name: Lint CDK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24


      - name: Lint CDK
        run: npm run lint --if-present
        working-directory: backend/infrastructure

      - name: Synthesize CDK
        run: npm run synth:ci
        working-directory: backend/infrastructure

  type-check:
    name: Type-check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24

      - name: Type-check Node apps
        run: |
          set -euo pipefail
          # template:set
          for dir in apps/admin_web apps/public_www backend/infrastructure; do
          # template:end
            if [ ! -f "$dir/package.json" ]; then echo "Skipping missing $dir"; continue; fi
            echo "Type-checking $dir"
            npm ci --prefix "$dir"
            npm run typecheck --if-present --prefix "$dir"
          done

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflows
        uses: lx-software-ltd/actions/workflow-conformance@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      # template:set
      - validate-agent-harness
      - repo-checks
      - lint-python
      - lint-admin-web
      - lint-public-www
      - lint-cdk
      - type-check
      - workflow-conformance
    # template:end
    if: always()
    steps:
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
