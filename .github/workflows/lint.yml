name: Lint

permissions:
  contents: read

on:
  workflow_dispatch:
  # No path filter. The `lint` job is a required check, and a skipped
  # required check leaves the pull request blocked.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  lint-web:
    name: Lint Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: apps/public_www

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/public_www

  lint-admin-web:
    name: Lint Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: apps/admin_web

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/admin_web

  build-cdk:
    name: Build CDK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: backend/infrastructure

      - name: Build CDK
        working-directory: backend/infrastructure
        run: npm run build

  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install ruff

      - name: Ruff
        run: python3 -m ruff check backend/lambda scripts .cursor/hooks

  validate-agent-harness:
    name: Validate agent harness
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          python-version: "3.12"

      - name: Run harness checks
        run: |
          python3 scripts/validate_agent_rules.py
          python3 scripts/check_file_length.py
          python3 scripts/check_test_focus.py
          python3 -m unittest scripts/test_agent_hooks.py scripts/test_harness_ratchets.py -v

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-web
      - lint-admin-web
      - build-cdk
      - lint-python
      - validate-agent-harness
    if: always()
    steps:
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          needs-json: ${{ toJson(needs) }}
