name: Lint
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

on:
  workflow_dispatch:
  # No path filter. The `lint` job is a required check, and a skipped
  # required check leaves the pull request blocked.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  lint-public-www:
    name: Lint Public Www
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/public_www

  lint-admin-web:
    name: Lint Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Run lint
        run: npm run lint --if-present
        working-directory: apps/admin_web

  build-cdk:
    name: Build CDK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Build CDK
        working-directory: backend/infrastructure
        run: npm run build

  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install ruff

      - name: Ruff
        run: python3 -m ruff check backend/lambda scripts .cursor/hooks

      - name: Install mypy
        run: python3 -m pip install 'mypy==1.8.0'

      - name: Mypy
        run: |
          set -euo pipefail
          dirs=()
          for dir in backend/lambda/*; do
            if [ -d "$dir" ] && find "$dir" -name '*.py' -print -quit | grep -q .; then
              dirs+=("$dir")
            fi
          done
          dirs+=(scripts .cursor/hooks)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "no Python directories to check"
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "mypy $dir"
            (
              cd "$dir"
              python3 -m mypy --ignore-missing-imports .
            )
          done

  validate-agent-harness:
    name: Validate agent harness
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Run harness checks
        uses: lx-software-ltd/actions/agent-harness@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24

      - name: Test harness ratchets
        run: python3 -m unittest scripts/test_agent_hooks.py -v

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflows
        uses: lx-software-ltd/actions/workflow-conformance@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          mode: enforce
          profile: product

  type-check:
    name: Type-check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24

      - name: Type-check Node apps
        run: |
          set -euo pipefail
          for dir in apps/admin_web apps/public_www backend/infrastructure; do
            echo "Type-checking $dir"
            npm ci --prefix "$dir"
            npm run typecheck --prefix "$dir"
          done

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - lint-public-www
      - lint-admin-web
      - build-cdk
      - lint-python
      - validate-agent-harness
      - workflow-conformance
      - type-check
    if: always()
    steps:
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
