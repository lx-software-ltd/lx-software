name: Deploy Public Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "scripts/deploy/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-public-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/public_www

      # Vite inlines VITE_* at build time. Contact values are public on the
      # page but must not live in git. Empty telephone / WhatsApp shows
      # "Not configured". Empty VITE_MEDIA_BASE_URL serves the harbour
      # files from this site. The live host is https://media.lx-software.com.
      # Empty VITE_CONTACT_LINKEDIN shows "Not configured" and omits sameAs.
      # Empty VITE_GTM_ID ships the site without Google Tag Manager / GA4.
      - name: Build public website
        working-directory: apps/public_www
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: npm run build

      # After the build. npm ci and the build must not see the deploy role.
      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Read the public website outputs
        id: site
        if: steps.aws.outputs.ready == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PUBLIC_WEBSITE_STACK_NAME: ${{ vars.PUBLIC_WEBSITE_STACK_NAME }}
        run: |
          set -euo pipefail
          stack="${PUBLIC_WEBSITE_STACK_NAME:-lxsoftware-public-www}"
          bucket="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='PublicWebsiteBucketName'].OutputValue" --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='PublicWebsiteDistributionId'].OutputValue" --output text)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "Public website bucket output not found for $stack" >&2
            exit 1
          fi
          if [ "$distribution" = "None" ]; then
            distribution=""
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"

      - name: Deploy public website
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          source: apps/public_www/dist
          bucket: ${{ steps.site.outputs.bucket }}
          distribution-id: ${{ steps.site.outputs.distribution }}
          profile: public-routes
          indexnow: "true"
          dry-run: "false"
