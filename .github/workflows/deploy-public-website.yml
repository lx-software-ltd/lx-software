name: Deploy Public Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "backend/infrastructure/**"
      - "scripts/deploy/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-public-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/public_www

      # Vite inlines VITE_* at build time. Contact values are public on the
      # page but must not live in git. Empty telephone / WhatsApp shows
      # "Not configured". Empty VITE_MEDIA_BASE_URL serves the harbour
      # files from this site; set it to https://media.lx-software.com once
      # the R2 bucket is live. Empty VITE_OWNER_NAME omits the Person node.
      - name: Build public website
        working-directory: apps/public_www
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_OWNER_NAME: ${{ vars.VITE_OWNER_NAME }}
        run: npm run build

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ACCOUNT_ID != '' && vars.AWS_REGION != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Deploy public website
        run: |
          if [ -f "scripts/deploy/deploy-public-website.sh" ]; then
            bash "scripts/deploy/deploy-public-website.sh"
          else
            echo "Deploy script not found: scripts/deploy/deploy-public-website.sh"
          fi
        env:
          PUBLIC_WEBSITE_STACK_NAME: ${{ vars.PUBLIC_WEBSITE_STACK_NAME }}
