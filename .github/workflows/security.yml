name: Security Scanning
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
          # Pillow/defusedxml force Docker ARM bundling; Checkov only needs the
          # CloudFormation template, same as CDK Jest (`bundling-stacks: []`).
          CDK_SKIP_PYTHON_PIP: "1"
        run: |
          npx cdk synth --quiet --output cdk.out \
            --parameters PublicWebsiteDomainName=example.com \
            --parameters PublicWebsiteCertificateArn=arn:aws:acm:us-east-1:123456789012:certificate/example

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # javascript-typescript is the analyzed language. The category stays
          # /language:javascript, which is where the existing alerts are filed.
          - language: javascript-typescript
            category: "/language:javascript"
          - language: python
            category: "/language:python"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: lx-software-ltd/actions/setup-python@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          category: ${{ matrix.category }}

  pii-denylist:
    permissions:
      contents: read
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24

  secrets-scan:
    permissions:
      contents: read
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24

  dependency-audit:
    permissions:
      contents: read
    name: Dependency audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          python-version: "3.12"

      # 22 Nov 2026: ignore-vulns is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when one is ignored.
      - name: Audit Python requirements
        uses: lx-software-ltd/actions/pip-audit@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          requirements: |
            backend/lambda/admin/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt

  bandit:
    permissions:
      contents: read
    name: Bandit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          python-version: "3.12"

      # Measured 22 Nov 2026 on backend/lambda, then again after the line
      # marks. No high findings. B101 is assert and stays the only skip.
      # Every other finding is # nosec on that line. B311 stays off the
      # skip list: the seeded Random in board_review_sample.py is
      # # nosec B311. Medium lines are B104 (four 0.0.0.0 fallbacks),
      # B108 (a test TemporaryDirectory under /tmp), B310 (sixteen
      # urlopen calls), and B608 (two Metrics Insights expressions).
      # Low lines are empty strings, token URLs, secret names, test
      # fixtures, optional-fetch continues, and a fixed openssl argv.
      # scripts/ is not scanned. The step exits 0.
      - name: Run Bandit
        uses: lx-software-ltd/actions/bandit@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          paths: backend/lambda
          skip: B101

  npm-audit:
    permissions:
      contents: read
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24

      # audit-level stays high. backend/infrastructure has a moderate minimatch
      # advisory below that level. No high advisory in the three lockfiles.
      # 22 Nov 2026: audit-level is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when the level changes.
      - name: Audit npm lockfiles
        uses: lx-software-ltd/actions/npm-audit@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure

  security-summary:
    permissions:
      contents: read
    name: security-summary
    runs-on: ubuntu-26.04
    needs: [checkov, codeql, pii-denylist, secrets-scan, dependency-audit, bandit, npm-audit]
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
