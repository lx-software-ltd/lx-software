name: Security Scanning

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkov:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        run: npm run synth:ci

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: CodeQL Analysis
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          # template:set
          # template:end
          category: "/language:${{ matrix.language }}"

  pii-denylist:
    permissions:
      contents: read
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

  secrets-scan:
    permissions:
      contents: read
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          config-path: .gitleaks.toml

  dependency-audit:
    permissions:
      contents: read
    name: Python Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Audit Python requirements
        uses: lx-software-ltd/actions/pip-audit@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          # template:set
          requirements: |
            backend/lambda/admin/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt
          # template:end

  bandit:
    permissions:
      contents: read
    name: Bandit Security Linter
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Run Bandit
        uses: lx-software-ltd/actions/bandit@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          # template:set
          paths: backend/lambda
          exclude: "**/test_*.py"
          # template:end

  npm-audit:
    permissions:
      contents: read
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Audit npm lockfiles
        uses: lx-software-ltd/actions/npm-audit@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          # template:set
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure
          # template:end

  security-summary:
    permissions:
      contents: read
    name: security-summary
    runs-on: ubuntu-26.04
    needs:
      - checkov
      - codeql
      - pii-denylist
      - secrets-scan
      - dependency-audit
      - bandit
      - npm-audit
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          needs-json: ${{ toJson(needs) }}
