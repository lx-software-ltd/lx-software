name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "26"
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
          # Pillow/defusedxml force Docker ARM bundling; Checkov only needs the
          # CloudFormation template, same as CDK Jest (`bundling-stacks: []`).
          CDK_SKIP_PYTHON_PIP: "1"
        run: |
          npx cdk synth --quiet --output cdk.out \
            --parameters PublicWebsiteDomainName=example.com \
            --parameters PublicWebsiteCertificateArn=arn:aws:acm:us-east-1:123456789012:certificate/example

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml
          framework: cloudformation

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # javascript-typescript is the analyzed language. The category stays
          # /language:javascript, which is where the existing alerts are filed.
          - language: javascript-typescript
            category: "/language:javascript"
          - language: python
            category: "/language:python"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          category: ${{ matrix.category }}

  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22

      - name: Test PII check normalization
        run: python3 -m unittest scripts/test_check_pii.py -v

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rule exclusions (centralized suppressions):
      # - python.lang.security.audit.dynamic-urllib-use-detected: Suppressed
      #   for backend/lambda/admin/handler.py and openrouter_statement_parser.py
      #   where urllib.request.urlopen() is called with HTTPS-only, fixed-scheme
      #   URLs (Frankfurter API base, OpenRouter API base). Both call sites
      #   already carry an inline `# noqa: S310` comment with the same rationale.
      - name: Run Semgrep
        run: |
          semgrep ci \
            --sarif \
            --output=semgrep-results.sarif \
            --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            || true
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/security-audit
            p/secrets

      - name: Filter in-source suppressed Semgrep findings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("semgrep-results.sarif")
          if not sarif_path.exists():
              print("semgrep-results.sarif not found; skipping suppression filter.")
              raise SystemExit(0)

          payload = json.loads(sarif_path.read_text(encoding="utf-8"))
          removed = 0
          for run in payload.get("runs", []):
              kept = []
              for result in run.get("results", []):
                  suppressions = result.get("suppressions", [])
                  if any(item.get("kind") == "inSource" for item in suppressions):
                      removed += 1
                      continue
                  kept.append(result)
              run["results"] = kept

          sarif_path.write_text(json.dumps(payload), encoding="utf-8")
          print(f"Removed {removed} in-source suppressed Semgrep findings from SARIF.")
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif
          wait-for-processing: false

  security-summary:
    name: Security Summary
    runs-on: ubuntu-26.04
    needs: [checkov, codeql, pii-denylist, secrets-scan, semgrep]
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          needs-json: ${{ toJson(needs) }}
