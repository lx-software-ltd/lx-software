name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: semgrep/ci
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gha-curl-pipe-shell parses run blocks as Bash and warns on
      # GitHub expressions, which marks Semgrep OSS as reporting warnings.
      - name: Run Semgrep
        uses: lx-software-ltd/actions/semgrep@edcf302f2f8712f49f18cb55a09abbab80e24388 # main 2026-11-24
        with:
          rules: p/python p/javascript p/security-audit p/secrets p/owasp-top-ten
          exclude-rules: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
