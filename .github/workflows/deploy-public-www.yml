name: Deploy Public Website

on:
  repository_dispatch:
    types: [deploy-public-www]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "scripts/deploy/**"

permissions:
  contents: read

concurrency:
  group: deploy-public-www
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      # Vite inlines VITE_* at build time. Contact values are public on the
      # page but must not live in git. Empty telephone / WhatsApp shows
      # "Not configured". Empty VITE_MEDIA_BASE_URL serves the harbour
      # files from this site. The live host is https://media.lx-software.com.
      # Empty VITE_CONTACT_LINKEDIN shows "Not configured" and omits sameAs.
      # Empty VITE_GTM_ID ships the site without Google Tag Manager / GA4.
      - name: Build public website
        working-directory: apps/public_www
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: npm run build

      # After the build. npm ci and the build must not see the deploy role.
      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Deploy public website
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          source: apps/public_www/dist
          stack: ${{ vars.PUBLIC_WEBSITE_STACK_NAME || 'lxsoftware-public-www' }}
          region: ${{ vars.AWS_REGION }}
          bucket-output: PublicWebsiteBucketName
          distribution-output: PublicWebsiteDistributionId
          profile: public-routes
          indexnow: "true"
          dry-run: "false"
