name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      cdk_stacks:
        description: "CDK stacks to deploy"
        required: false
        default: "all stacks"
        type: choice
        options:
          # template:set
          - "all stacks"
          - "lxsoftware"
          - "lxsoftware-admin-web"
          - "lxsoftware-public-www"
          # template:end
  push:
    branches:
      - main
    # template:set
    paths:
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
    # template:end

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27

      - name: Determine deployment region
        id: region
        env:
          INPUT_CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          INPUT_AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/deploy/cdk-prepare.sh region

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ steps.region.outputs.region }}

      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64


      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ steps.region.outputs.region }}
      - name: Prepare CDK app
        id: prep
        run: bash scripts/deploy/cdk-prepare.sh deploy
        # template:set
        env:
          CDK_STACKS: ${{ inputs.cdk_stacks }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
        # template:end


      - name: Deploy stacks
        uses: lx-software-ltd/actions/cdk-deploy@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          working-directory: backend/infrastructure
          plan-file: backend/infrastructure/cdk-plan.json
          # template:set
          stacks: ${{ inputs.cdk_stacks }}
          # template:end
          param-file: ${{ vars.CDK_PARAM_FILE }}
          attempts: "3"
          # template:set
          # template:end
          region: ${{ steps.region.outputs.region }}
        # template:set
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN }}
          CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN }}
          CDK_PARAM_SIUTINDEI_CLUSTER_ARN: ${{ secrets.CDK_PARAM_SIUTINDEI_CLUSTER_ARN }}
          CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN: ${{ secrets.CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_META_VERIFY_TOKEN: ${{ secrets.SIUTINDEI_BOARD_META_VERIFY_TOKEN }}
        # template:end
