name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      # template:set
      cdk_stacks:
        description: CDK stacks to deploy. Empty deploys every stack in the plan.
        required: false
        default: ""
        type: string
      # template:end
  push:
    branches:
      - main
    # template:set
    # AdminApiFn / inbound-mail / authorizer code lives next to the CDK app.
    # A Lambda-only PR (no stack.ts change) must still roll the function, or
    # the admin SPA can ship a button whose route 404s on the previous build.
    paths:
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
    # template:end

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # template:set
    # template:end
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # template:set
        # template:end


      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure
      # template:set
      # template:end
      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24


      - name: Configure AWS credentials
        # template:set
        id: aws
        # template:end
        uses: lx-software-ltd/actions/aws-oidc@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          # template:set
          region: ${{ vars.AWS_REGION }}
          # template:end

      # template:optional qemu
      # template:set
      # AdminApiFn bundles pip dependencies (Pillow, defusedxml) inside the
      # linux/arm64 SAM build image. The x86-64 runner needs QEMU binfmt
      # registered or `docker run --platform linux/arm64` fails with
      # "exec /usr/bin/bash: exec format error".
      # template:end
      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # template:end

      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          # template:set
          region: ${{ vars.AWS_REGION }}
          # template:end
      - name: Prepare CDK app
        id: prep
        run: bash scripts/deploy/cdk-prepare.sh deploy
        # template:set
        env:
          CDK_STACKS: ${{ inputs.cdk_stacks }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
        # template:end


      - name: Deploy stacks
        uses: lx-software-ltd/actions/cdk-deploy@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          plan-file: backend/infrastructure/cdk-plan.json
          # template:set
          stacks: ${{ inputs.cdk_stacks }}
          # template:end
          param-file: ${{ vars.CDK_PARAM_FILE }}
          attempts: "3"
          # template:set
          # template:end
          # template:set
          region: ${{ vars.AWS_REGION }}
          # template:end
        # template:set
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN }}
          CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN }}
          CDK_PARAM_SIUTINDEI_CLUSTER_ARN: ${{ secrets.CDK_PARAM_SIUTINDEI_CLUSTER_ARN }}
          CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN: ${{ secrets.CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_META_VERIFY_TOKEN: ${{ secrets.SIUTINDEI_BOARD_META_VERIFY_TOKEN }}
        # template:end
