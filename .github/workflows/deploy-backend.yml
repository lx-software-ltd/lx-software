name: Deploy Backend

on:
  push:
    branches: [main]
    # AdminApiFn / inbound-mail / authorizer code lives next to the CDK app.
    # A Lambda-only PR (no stack.ts change) must still roll the function, or
    # the admin SPA can ship a button whose route 404s on the previous build.
    paths:
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install CDK dependencies
        run: |
          if [ ! -f "backend/infrastructure/package.json" ]; then
            echo "Missing backend/infrastructure/package.json"
            exit 1
          fi
          cd backend/infrastructure
          npm ci

      - name: Build CDK app
        run: |
          cd backend/infrastructure
          npm run build --if-present

      # AdminApiFn bundles pip dependencies (Pillow, defusedxml) inside the
      # linux/arm64 SAM build image. The x86-64 runner needs QEMU binfmt
      # registered or `docker run --platform linux/arm64` fails with
      # "exec /usr/bin/bash: exec format error".
      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Acknowledge CDK notices
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Build the CDK plan
        id: plan
        env:
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
        run: |
          python3 - << 'PY'
          import json as _json
          import os
          from pathlib import Path

          def build_plan():
              extra = [
                  "--parameters",
                  "lxsoftware:AdminWebDomainName=admin.lx-software.com",
                  "--parameters",
                  "lxsoftware:GoogleClientId=" + os.environ.get("P_GOOGLE_CLIENT_ID", ""),
                  "--parameters",
                  "lxsoftware:GoogleClientSecret=" + os.environ.get("P_GOOGLE_CLIENT_SECRET", ""),
                  "--parameters",
                  "lxsoftware:AdminFederatedEmailAllowlist=" + os.environ.get("P_EMAIL_ALLOWLIST", ""),
                  "--parameters",
                  "lxsoftware:CognitoDomainPrefix=lxsoftware-admin-auth",
                  "--parameters",
                  "lxsoftware-admin-web:AdminWebDomainName=admin.lx-software.com",
              ]
              return {
                  "unprefixed-prefix": "lxsoftware-public-www:",
                  "groups": [
                      {
                          "stacks": ["lxsoftware-public-www"],
                          "prefixes": ["lxsoftware-public-www:"],
                      },
                      {
                          "stacks": ["lxsoftware", "lxsoftware-admin-web"],
                          "prefixes": ["lxsoftware:", "lxsoftware-admin-web:"],
                          "allowlist-env": "P_EMAIL_ALLOWLIST",
                          "append-if-set": [
                              {
                                  "parameter": "lxsoftware:SiutindeiBoardMetaVerifyToken",
                                  "env": "P_META_VERIFY_TOKEN",
                              }
                          ],
                          "extra-args": extra,
                      },
                  ],
              }

          plan = _json.dumps(build_plan())
          for name in ("P_GOOGLE_CLIENT_SECRET", "P_EMAIL_ALLOWLIST"):
              value = os.environ.get(name, "")
              if value:
                  print(f"::add-mask::{value}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("plan<<PLANJSON\n")
              handle.write(plan + "\n")
              handle.write("PLANJSON\n")
          PY

      - name: Deploy CDK stacks
        uses: lx-software-ltd/actions/cdk-deploy@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          working-directory: backend/infrastructure
          plan: ${{ steps.plan.outputs.plan }}
          param-file: ${{ vars.CDK_PARAM_FILE }}
          format: prefixed-json
          attempts: "1"
          no-notices: "false"
          escape-newlines: "false"
          rollback-match: is in UPDATE_ROLLBACK_FAILED state and can not be updated
          region: ${{ vars.AWS_REGION }}
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WEBSITE_CERTIFICATE_ARN }}
          CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY_SECRET_ARN }}
          CDK_PARAM_SIUTINDEI_CLUSTER_ARN: ${{ secrets.CDK_PARAM_SIUTINDEI_CLUSTER_ARN }}
          CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN: ${{ secrets.CDK_PARAM_EVOLVESPROUTS_CLUSTER_ARN }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_META_VERIFY_TOKEN: ${{ secrets.SIUTINDEI_BOARD_META_VERIFY_TOKEN }}
