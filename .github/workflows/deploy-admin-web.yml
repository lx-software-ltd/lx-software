name: Deploy Admin Web

on:
  push:
    branches: [main]
    paths: ["apps/admin_web/**", "scripts/deploy/deploy-admin-www.sh", ".github/workflows/deploy-admin-web.yml"]
  workflow_dispatch:
  # A backend deploy can replace the Cognito client or the HTTP API. Rebuild
  # the SPA from current main so it picks up those outputs. Only a successful
  # Deploy Backend on main qualifies.
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Read admin SPA settings from the lxsoftware stack
        id: stack_outputs
        uses: lx-software-ltd/actions/cfn-stack-outputs@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          stack: lxsoftware
          outputs: UserPoolClientId CognitoDomain AdminApiBaseUrl
          region: ${{ vars.AWS_REGION }}

      - name: Check admin SPA settings
        id: admin_spa
        env:
          JSON: ${{ steps.stack_outputs.outputs.json }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["JSON"])
          domain = data["CognitoDomain"]
          api_url = data["AdminApiBaseUrl"]
          client_id = data["UserPoolClientId"]
          if not domain.startswith("https://"):
              print("::error::CognitoDomain on lxsoftware must be an https origin", file=sys.stderr)
              sys.exit(1)
          if not api_url.startswith("https://"):
              print("::error::AdminApiBaseUrl on lxsoftware must be an https origin", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"client_id={client_id}\n")
              handle.write(f"domain={domain}\n")
              handle.write(f"api_url={api_url}\n")
          PY

      - run: npm run build
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: ${{ steps.admin_spa.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.admin_spa.outputs.domain }}
          VITE_COGNITO_REDIRECT_URI: https://admin.lx-software.com/auth/callback
          VITE_API_BASE_URL: ${{ steps.admin_spa.outputs.api_url }}

      - name: Upload the admin site
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          source: apps/admin_web/dist
          stack: lxsoftware-admin-web
          region: ${{ vars.AWS_REGION }}
          bucket-output: AdminWebBucketName
          distribution-output: AdminWebDistributionId
          profile: admin-hashed
          dry-run: "false"
