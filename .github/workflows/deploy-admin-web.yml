name: Deploy Admin Web

on:
  push:
    branches: [main]
    paths: ["apps/admin_web/**", "scripts/deploy/deploy-admin-www.sh"]
  workflow_dispatch:
  # A backend deploy can replace the Cognito client or the HTTP API. Rebuild
  # the SPA from current main so it picks up those outputs. Only a successful
  # Deploy Backend on main qualifies.
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - run: npm ci
        working-directory: apps/admin_web

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Read admin SPA settings from the lxsoftware stack
        id: stack_outputs
        uses: lx-software-ltd/actions/cfn-stack-outputs@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          stack: lxsoftware
          outputs: UserPoolClientId CognitoDomain AdminApiBaseUrl
          region: ${{ vars.AWS_REGION }}

      - name: Check admin SPA settings
        id: admin_spa
        env:
          JSON: ${{ steps.stack_outputs.outputs.json }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["JSON"])
          domain = data["CognitoDomain"]
          api_url = data["AdminApiBaseUrl"]
          client_id = data["UserPoolClientId"]
          if not domain.startswith("https://"):
              print("::error::CognitoDomain on lxsoftware must be an https origin", file=sys.stderr)
              sys.exit(1)
          if not api_url.startswith("https://"):
              print("::error::AdminApiBaseUrl on lxsoftware must be an https origin", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"client_id={client_id}\n")
              handle.write(f"domain={domain}\n")
              handle.write(f"api_url={api_url}\n")
          PY

      - run: npm run build
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: ${{ steps.admin_spa.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.admin_spa.outputs.domain }}
          VITE_COGNITO_REDIRECT_URI: https://admin.lx-software.com/auth/callback
          VITE_API_BASE_URL: ${{ steps.admin_spa.outputs.api_url }}

      - name: Checkout the pinned deploy action
        if: steps.aws.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lx-software-ltd/actions
          ref: e6be2629d7206b0d5c079662f364772bc816acc1
          path: .actions-pin

      - name: Compare the dry run with the current deploy
        if: steps.aws.outputs.ready == 'true'
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_WEB_STACK_NAME: lxsoftware-admin-web
        run: |
          set -euo pipefail
          stack=lxsoftware-admin-web
          bucket="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebBucketName'].OutputValue" --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebDistributionId'].OutputValue" --output text)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "Admin web bucket output not found for $stack" >&2
            exit 1
          fi
          if [ "$distribution" = "None" ]; then
            distribution=""
          fi
          real_aws="$(command -v aws)"
          bindir="$RUNNER_TEMP/aws-dry/bin"
          mkdir -p "$bindir"
          REAL_AWS="$real_aws" BINDIR="$bindir" python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["BINDIR"]) / "aws"
          path.write_text(
              "#!/usr/bin/env bash\n"
              "set -euo pipefail\n"
              f"real={os.environ['REAL_AWS']!r}\n"
              'if [[ "$1" == "s3" ]]; then\n'
              '  exec "$real" s3 "$2" --dryrun "${@:3}"\n'
              "fi\n"
              'if [[ "$1" == "cloudfront" ]]; then\n'
              '  echo "Dry run: skipping CloudFront invalidation" >&2\n'
              "  exit 0\n"
              "fi\n"
              'exec "$real" "$@"\n'
          )
          path.chmod(0o755)
          PY
          PATH="$bindir:$PATH" bash scripts/deploy/deploy-admin-www.sh > "$RUNNER_TEMP/current-deploy.txt"
          SOURCE="$GITHUB_WORKSPACE/apps/admin_web/dist" \
            BUCKET="$bucket" \
            DISTRIBUTION_ID="$distribution" \
            PROFILE=admin-hashed \
            DRY_RUN=true \
            python3 "$GITHUB_WORKSPACE/.actions-pin/s3-cloudfront-deploy/s3_sync.py" > "$RUNNER_TEMP/action-deploy.txt"
          CURRENT="$RUNNER_TEMP/current-deploy.txt" ACTION="$RUNNER_TEMP/action-deploy.txt" python3 - << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          account = re.compile(r"\b\d{12}\b")

          def planned(path):
              found = []
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if "(dryrun)" not in line:
                      continue
                  if " to " in line:
                      found.append("upload " + line.split(" to ", 1)[1].strip())
                  else:
                      found.append(line.split("(dryrun)", 1)[1].strip())
              return sorted(found)

          current = planned(os.environ["CURRENT"])
          action = planned(os.environ["ACTION"])
          if not current or not action:
              raise SystemExit("dry run produced no planned S3 changes")
          if current != action:
              print("planned S3 changes differ", file=sys.stderr)
              for line in current:
                  if line not in action:
                      print("current only: " + account.sub("************", line), file=sys.stderr)
              for line in action:
                  if line not in current:
                      print("action only: " + account.sub("************", line), file=sys.stderr)
              raise SystemExit(1)
          print(f"Dry run matches the current deploy ({len(current)} planned S3 changes)")
          PY

      - run: bash scripts/deploy/deploy-admin-www.sh
