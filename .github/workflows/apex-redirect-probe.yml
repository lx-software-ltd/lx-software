name: Apex redirect probe

on:
  schedule:
    # Monday 09:30 UTC. Public HTTP only; no Cloudflare token.
    - cron: "30 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cloudflare/publish-apex-redirect.py
      - scripts/cloudflare/lx-software-apex-redirect.js
      - .github/workflows/apex-redirect-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe apex redirects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Probe live apex redirects
        run: python3 scripts/cloudflare/publish-apex-redirect.py probe
