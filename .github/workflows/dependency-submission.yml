name: Dependency Submission

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check Dependency Submission
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned manifests
        uses: lx-software-ltd/actions/dependency-submission@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          submit: "false"

  submit:
    name: Submit Dependency Submission
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Submit pinned manifests
        uses: lx-software-ltd/actions/dependency-submission@4362f03b0b45bd7933790e159e757ad9691b12a1 # main 2026-11-27
        with:
          submit: "true"
          token: ${{ github.token }}
