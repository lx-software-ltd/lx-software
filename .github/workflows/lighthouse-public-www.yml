name: Lighthouse Public Website

on:
  workflow_dispatch:
    inputs:
      page_paths:
        description: 'Comma/newline-separated page paths or full URLs to audit (e.g. /, /privacy)'
        required: false
        default: '/, /fractional-cto-hong-kong, /about, /privacy, /terms, /wechat'
  pull_request:
    paths:
      - 'apps/public_www/**'
      - '.github/workflows/lighthouse-public-www.yml'
  schedule:
    - cron: '15 6 * * 1'

permissions:
  contents: read

concurrency:
  group: lighthouse-public-www-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    permissions:
      contents: read
      statuses: write
    name: Lighthouse audit
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-26.04
    # The VITE_* build variables live on the production environment, the same
    # ones Deploy Public Website reads, so the audited bundle matches the live site.
    # .lighthouserc.json blocks the GTM / GA4 hosts during the audit: the bundle
    # still carries VITE_GTM_ID, but the runs no longer count as sessions on the
    # production GA4 property (three runs per page per workflow used to show up
    # as US "direct" traffic on /privacy, /terms and /wechat).
    # production allows only main. A pull_request ref is refs/pull/N/merge, so
    # this job does not run for a pull request. The pull-request job below
    # audits without that environment.
    environment: production
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Build public website
        working-directory: apps/public_www
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: npm run build

      - name: Run Lighthouse CI
        uses: lx-software-ltd/actions/lighthouse-ci@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: apps/public_www
          page-paths: ${{ inputs.page_paths }}
          default-paths: /, /fractional-cto-hong-kong, /about, /privacy, /terms, /wechat
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-public-www-results
          path: apps/public_www/.lighthouseci/**
          if-no-files-found: warn
          include-hidden-files: true

  lighthouse-pull-request:
    permissions:
      contents: read
      statuses: write
    name: Lighthouse audit
    # Dependabot cannot read the production variables. The pull request
    # author is what matters: a later push to that branch is not made by
    # the Dependabot actor. This job does not select production: that
    # environment allows only main, and the pull request ref is rejected
    # before any step.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Build public website
        working-directory: apps/public_www
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: npm run build

      - name: Run Lighthouse CI
        uses: lx-software-ltd/actions/lighthouse-ci@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: apps/public_www
          page-paths: ${{ inputs.page_paths }}
          default-paths: /, /fractional-cto-hong-kong, /about, /privacy, /terms, /wechat
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-public-www-results
          path: apps/public_www/.lighthouseci/**
          if-no-files-found: warn
          include-hidden-files: true
