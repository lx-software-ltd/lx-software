name: Lighthouse Public Website

on:
  workflow_dispatch:
    inputs:
      page_paths:
        # template:set
        description: "Comma/newline-separated page paths or full URLs to audit (e.g. /, /privacy)"
        # template:end
        required: false
        # template:set
        default: "/, /fractional-cto-hong-kong, /about, /privacy, /terms, /wechat"
        # template:end
  pull_request:
    paths:
      - "apps/public_www/**"
      - ".github/workflows/lighthouse-public-www.yml"
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

concurrency:
  group: lighthouse-public-www-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    permissions:
      contents: read
      statuses: write
    name: Lighthouse audit
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # template:set
        with:
          lfs: false
        # template:end


      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www


      - name: Build public website
        working-directory: apps/public_www
        # template:set
        env:
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_CONTACT_TEL: ${{ vars.VITE_CONTACT_TEL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WECHAT_ID: ${{ vars.VITE_CONTACT_WECHAT_ID }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        # template:end
        run: npm run build

      - name: Run Lighthouse CI
        uses: lx-software-ltd/actions/lighthouse-ci@a461dd613711bb036918699617487c42f324cc9e # main 2026-11-24
        with:
          working-directory: apps/public_www
          page-paths: ${{ inputs.page_paths }}
          # template:set
          default-paths: /, /fractional-cto-hong-kong, /about, /privacy, /terms, /wechat
          # template:end
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-public-www-results
          path: apps/public_www/.lighthouseci/**
          if-no-files-found: warn
          include-hidden-files: true
