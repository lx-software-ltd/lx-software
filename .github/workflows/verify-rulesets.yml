name: Verify GitHub Rulesets

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-branch-protection:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify rulesets
        uses: lx-software-ltd/actions/verify-rulesets@f33bc376b6745fcf47a4af88e436ce14b8e55c9b # main 2026-11-21
        with:
          token: ${{ github.token }}
          expected-reviews: "0"
          required-checks: lint test
