name: Manage Public API Keys
# template:set
# Mint / list / revoke / set-write / set-scopes the public API keys served by the /public/*
# routes (see docs/deployment/admin-website.md, "Public API keys").
#
# SECURITY: this repository is PUBLIC, so workflow logs are world-readable.
# A newly minted key is therefore never printed; it is written to a file and
# symmetrically encrypted (gpg AES256) with the PUBLIC_API_KEY_GPG_PASSPHRASE
# secret before the armored ciphertext is shown. Decrypt locally with:
#
#   pbpaste > key.asc   # or paste the block into key.asc
#   gpg --decrypt key.asc
#
# entering the same passphrase. Configure the secret once under
# Settings > Environments > production > Secrets.
# template:end

on:
  workflow_dispatch:
    inputs:
      # template:set
      action:
        description: "What to do"
        required: true
        type: choice
        options: [create, list, revoke, set-write, set-scopes]
      label:
        description: "Key label (create only)"
        required: false
        type: string
      expires_at:
        description: "Expiry, ISO date e.g. 2027-01-01 (create only; default 90 days)"
        required: false
        type: string
      scopes:
        description: "Comma-separated scopes (create, and set-scopes which replaces the list)"
        required: false
        type: string
      allowed_cidrs:
        description: "Comma-separated CIDRs (create only, optional)"
        required: false
        type: string
      allow_write:
        description: "Opt the key into PUT/POST/DELETE (create and set-write)"
        required: false
        type: boolean
        default: false
      key_id:
        description: "keyId to revoke, set-write or set-scopes"
        required: false
        type: string
      # template:end

permissions:
  contents: read

concurrency:
  group: manage-api-keys
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    name: Manage keys
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24

      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          LABEL: ${{ inputs.label }}
          KEY_ID: ${{ inputs.key_id }}
          SCOPES: ${{ inputs.scopes }}
          HAS_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE != '' }}
        run: bash scripts/deploy/validate-api-key-inputs.sh

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Create key
        if: inputs.action == 'create'
        # template:set
        env:
          LABEL: ${{ inputs.label }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          SCOPES: ${{ inputs.scopes }}
          ALLOWED_CIDRS: ${{ inputs.allowed_cidrs }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          GPG_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        # template:end
        run: bash scripts/deploy/create-api-key.sh

      - name: List keys
        if: inputs.action == 'list'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py list --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revoke key
        if: inputs.action == 'revoke'
        env:
          KEY_ID: ${{ inputs.key_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py revoke --key-id "$KEY_ID" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set write
        if: inputs.action == 'set-write'
        env:
          KEY_ID: ${{ inputs.key_id }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          FLAG="--read-only"
          if [ "$ALLOW_WRITE" = "true" ]; then
            FLAG="--allow-write"
          fi
          python3 scripts/manage-public-api-keys.py set-write --key-id "$KEY_ID" "$FLAG" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set scopes
        if: inputs.action == 'set-scopes'
        env:
          KEY_ID: ${{ inputs.key_id }}
          SCOPES: ${{ inputs.scopes }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py set-scopes --key-id "$KEY_ID" --scopes "$SCOPES" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"
