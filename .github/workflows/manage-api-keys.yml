name: Manage Public API Keys

on:
  workflow_dispatch:
    inputs:
      action:
        # template:set
        description: "What to do"
        # template:end
        required: true
        type: choice
        options:
          - create
          - list
          - revoke
          - set-write
          - set-scopes
      label:
        # template:set
        description: "Key label (create only)"
        # template:end
        required: false
        type: string
      expires_at:
        # template:set
        description: "Expiry, ISO date e.g. 2027-01-01 (create only; default 90 days)"
        # template:end
        required: false
        type: string
      scopes:
        # template:set
        description: "Comma-separated scopes (create, and set-scopes which replaces the list)"
        # template:end
        required: false
        type: string
      allowed_cidrs:
        # template:set
        description: "Comma-separated CIDRs (create only, optional)"
        # template:end
        required: false
        type: string
      allow_write:
        # template:set
        description: "Opt the key into PUT/POST/DELETE (create and set-write)"
        # template:end
        required: false
        type: boolean
        default: false
      key_id:
        # template:set
        description: "keyId to revoke, set-write or set-scopes"
        # template:end
        required: false
        type: string
      tier:
        # template:set
        description: "Minted keys use the admin tier"
        # template:end
        required: false
        type: choice
        default: admin
        options:
          - admin

permissions:
  contents: read

concurrency:
  group: manage-api-keys
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    name: Manage keys
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@edcf302f2f8712f49f18cb55a09abbab80e24388 # main 2026-11-24

      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          LABEL: ${{ inputs.label }}
          KEY_ID: ${{ inputs.key_id }}
          SCOPES: ${{ inputs.scopes }}
          HAS_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE != '' }}
        run: bash scripts/deploy/validate-api-key-inputs.sh

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@edcf302f2f8712f49f18cb55a09abbab80e24388 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Create key
        if: inputs.action == 'create'
        # template:set
        env:
          LABEL: ${{ inputs.label }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          SCOPES: ${{ inputs.scopes }}
          ALLOWED_CIDRS: ${{ inputs.allowed_cidrs }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          GPG_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        # template:end
        run: bash scripts/deploy/create-api-key.sh

      - name: List keys
        if: inputs.action == 'list'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py list --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revoke key
        if: inputs.action == 'revoke'
        env:
          KEY_ID: ${{ inputs.key_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py revoke --key-id "$KEY_ID" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set write
        if: inputs.action == 'set-write'
        env:
          KEY_ID: ${{ inputs.key_id }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          FLAG="--read-only"
          if [ "$ALLOW_WRITE" = "true" ]; then
            FLAG="--allow-write"
          fi
          python3 scripts/manage-public-api-keys.py set-write --key-id "$KEY_ID" "$FLAG" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set scopes
        if: inputs.action == 'set-scopes'
        env:
          KEY_ID: ${{ inputs.key_id }}
          SCOPES: ${{ inputs.scopes }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py set-scopes --key-id "$KEY_ID" --scopes "$SCOPES" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"
