name: Dependency graph

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check dependency graph
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pinned manifests
        uses: lx-software-ltd/actions/dependency-graph@82f7f9b4cd0d304e9ebcf6aac28c7fc123b9feb0 # main 2026-11-23
        with:
          submit: "false"

  submit:
    name: Submit dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Submit pinned manifests
        uses: lx-software-ltd/actions/dependency-graph@82f7f9b4cd0d304e9ebcf6aac28c7fc123b9feb0 # main 2026-11-23
        with:
          submit: "true"
          token: ${{ github.token }}
