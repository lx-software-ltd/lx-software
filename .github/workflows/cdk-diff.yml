name: CDK Diff

on:
  workflow_dispatch:
    inputs:
      stacks:
        description: "Optional space/comma-separated CDK stack names"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cdk-diff
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-26.04
    env:
      CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install CDK dependencies
        run: |
          if [ -f "backend/infrastructure/package.json" ]; then
            cd backend/infrastructure
            npm ci
          else
            echo "::warning::Missing backend/infrastructure/package.json"
            echo "Missing backend/infrastructure/package.json"
          fi

      # `cdk diff` synthesizes with asset bundling; AdminApiFn pip deps are
      # installed in the linux/arm64 SAM image, which needs QEMU on x86-64.
      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Check CDK Bootstrap status
        uses: lx-software-ltd/actions/cdk-bootstrap-check@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Prepare CDK diff
        id: prep
        run: |
          if [ ! -f "backend/infrastructure/package.json" ]; then
            echo "::warning::Missing backend/infrastructure/package.json"
            echo "Missing backend/infrastructure/package.json"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd backend/infrastructure
          npx cdk acknowledge 34892 || true
          npm run build --if-present
          PUBLIC_PARAM_ARGS=()
          ADMIN_LX_PARAM_ARGS=()
          ADMIN_WEB_PARAM_ARGS=()
          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }
          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -n "$RESOLVED_PARAM_FILE" ]; then
              # shellcheck source=../../scripts/deploy/cdk-params.sh
              source ../../scripts/deploy/cdk-params.sh
              cdk_load_param_args "$RESOLVED_PARAM_FILE"
            else
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
          fi
          PARAM_ARGS=( "${PUBLIC_PARAM_ARGS[@]}" "${ADMIN_LX_PARAM_ARGS[@]}" "${ADMIN_WEB_PARAM_ARGS[@]}" )
          if [ ${#PARAM_ARGS[@]} -gt 0 ]; then
            printf '%s\0' "${PARAM_ARGS[@]}" > "$RUNNER_TEMP/cdk-diff-args"
          else
            : > "$RUNNER_TEMP/cdk-diff-args"
          fi
          STACK_ARGS=()
          if [ -n "${CDK_STACKS:-}" ]; then
            IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"
            for stack in "${STACK_LIST[@]}"; do
              trimmed="${stack#"${stack%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                STACK_ARGS+=("$trimmed")
              fi
            done
          fi
          {
            echo "run=true"
            echo "stacks=${STACK_ARGS[*]}"
          } >> "$GITHUB_OUTPUT"
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}

      - name: Run CDK diff
        if: steps.prep.outputs.run == 'true'
        uses: lx-software-ltd/actions/cdk-diff@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          working-directory: backend/infrastructure
          stacks: ${{ steps.prep.outputs.stacks }}
          args-file: ${{ runner.temp }}/cdk-diff-args
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
