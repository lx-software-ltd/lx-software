name: Test

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-python:
    name: Test Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # template:set
        # template:end

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24

      - name: Run Python tests
        run: bash scripts/ci/test-python.sh
        # template:set
        # template:end
  test-admin-web:
    name: Test Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/admin_web
        # template:set
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com
        # template:end

      - name: Build
        run: npm run build
        working-directory: apps/admin_web
        # template:set
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com
        # template:end

  test-public-www:
    name: Test Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/public_www
        # template:set
        # template:end

      - name: Build
        run: npm run build
        working-directory: apps/public_www
        # template:set
        # template:end

  test-infrastructure:
    name: Test infrastructure
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24

      - name: Run infrastructure tests
        run: npm run test:infra
        working-directory: backend/infrastructure

  # template:optional playwright-admin
  e2e-admin-web:
    name: Admin Web viewport smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Install Playwright Chromium
        uses: lx-software-ltd/actions/playwright-install@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          working-directory: apps/admin_web
          # template:set
          browsers: chromium
          # template:end

      - name: Run viewport smoke tests
        run: npm run test:e2e
        working-directory: apps/admin_web
        # template:set
        # template:end

  # template:end
  test:
    name: test
    runs-on: ubuntu-26.04
    # template:set
    needs:
      - test-python
      - test-admin-web
      - test-public-www
      - test-infrastructure
      - e2e-admin-web
    # template:end
    if: always()
    steps:
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@7274dbbda035e283bf0d2a78c98d45deae348344 # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
