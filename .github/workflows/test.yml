name: Test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

on:
  workflow_dispatch:
  # No path filter. The `test` job is a required check, and a skipped
  # required check leaves the pull request blocked.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"

jobs:
  check-contracts:
    name: Check shared contracts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Script tests resolve [why:] commit ids. A shallow clone cannot see them.
          fetch-depth: 0
      - name: Verify contract artifacts
        run: python3 scripts/check-contracts.py

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24

      - name: Test OpenRouter key mint script
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  test-web:
    name: Test Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run tests
        run: npm run test --if-present
        working-directory: apps/public_www

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www

  build-admin-web:
    name: Build Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Build admin website
        run: npm run build
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

      - name: Install admin Lambda test deps
        run: python3 -m pip install -q -r backend/lambda/admin/requirements.txt

      - name: Test admin website
        run: npm test
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

  e2e-admin-web:
    name: Admin Web viewport smoke
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Install Playwright Chromium
        uses: lx-software-ltd/actions/playwright-install@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: apps/admin_web
          browsers: chromium

      - name: Run viewport smoke tests
        run: npm run test:e2e
        working-directory: apps/admin_web

  test-infrastructure:
    name: Test Infrastructure
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Build CDK app
        run: npm run build
        working-directory: backend/infrastructure

      # Synthesizes the stacks with aws-cdk-lib/assertions (no AWS credentials
      # or Docker needed; asset bundling is disabled in the tests).
      - name: Run CDK assertion tests
        run: npm test
        working-directory: backend/infrastructure
        env:
          CI: "true"

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - check-contracts
      - test-web
      - build-admin-web
      - e2e-admin-web
      - test-infrastructure
    if: always()
    steps:
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
