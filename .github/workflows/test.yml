name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/**"
      - "contracts/**"
      - "scripts/sync-contracts.py"
      - "scripts/check-contracts.py"
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"

jobs:
  check-contracts:
    name: Check shared contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify contract artifacts
        run: python3 scripts/check-contracts.py

      - name: Test OpenRouter key mint script
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  test-web:
    name: Test Public Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/public_www

      - name: Run tests
        run: npm run test --if-present
        working-directory: apps/public_www

  build-admin-web:
    name: Build Admin Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/admin_web

      - name: Build admin website
        run: npm run build
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_USER_POOL_ID: us-east-1_PLACEHOLDER
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

      - name: Test admin website
        run: npm test
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_USER_POOL_ID: us-east-1_PLACEHOLDER
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

  e2e-admin-web:
    name: Admin Web viewport smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/admin_web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin_web

      - name: Run viewport smoke tests
        run: npm run test:e2e
        working-directory: apps/admin_web

  test-infrastructure:
    name: Test Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: backend/infrastructure

      - name: Build CDK app
        run: npm run build
        working-directory: backend/infrastructure

      # Synthesizes the stacks with aws-cdk-lib/assertions (no AWS credentials
      # or Docker needed; asset bundling is disabled in the tests).
      - name: Run CDK assertion tests
        run: npm test
        working-directory: backend/infrastructure
        env:
          CI: "true"
