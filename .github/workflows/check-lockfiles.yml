name: Check Lockfiles
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@385abf462c6d47a66afcb7cebc15152ffe7049e7 # main 2026-11-23

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@385abf462c6d47a66afcb7cebc15152ffe7049e7 # main 2026-11-23
        with:
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure

  python-requirements:
    name: Check Python requirement pins
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@385abf462c6d47a66afcb7cebc15152ffe7049e7 # main 2026-11-23
        with:
          files: |
            backend/lambda/admin/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt
