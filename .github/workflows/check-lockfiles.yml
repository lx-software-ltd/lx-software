name: Check Lockfiles

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "lts/*"

      - name: Validate package-lock.json
        run: |
          set -e
          for dir in apps/public_www apps/admin_web backend/infrastructure; do
            if [ -f "$dir/package.json" ]; then
              if [ ! -f "$dir/package-lock.json" ]; then
                echo "Missing package-lock.json in $dir"
                exit 1
              fi
              (cd "$dir" && npm ci)
              if ! git diff --exit-code "$dir/package-lock.json"; then
                echo "package-lock.json is out of sync in $dir"
                exit 1
              fi
            else
              echo "Skipping Node lockfile check for $dir"
            fi
          done
