name: Check Lockfiles

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@962b4408003d89c3bf791ce9299bd13eb75a418e # main 2026-11-24

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@962b4408003d89c3bf791ce9299bd13eb75a418e # main 2026-11-24
        with:
          # template:set
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure
          # template:end

  python-requirements:
    name: Check Python requirements
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@962b4408003d89c3bf791ce9299bd13eb75a418e # main 2026-11-24
        with:
          # template:set
          files: |
            backend/lambda/admin/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt
          # template:end
