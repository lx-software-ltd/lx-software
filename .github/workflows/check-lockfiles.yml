name: Check Lockfiles

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure

  python-requirements:
    name: Check Python requirement pins
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          files: |
            backend/lambda/admin/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt
