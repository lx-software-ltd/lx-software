components:
  schemas:
    Object:
      type: object
      additionalProperties: true
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
        message:
          type: string
        reason:
          type: string
  responses:
    Problem:
      description: Problem details. lx-software keeps message and reason.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
